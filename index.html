<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Japão 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="map-stage" aria-hidden="true">
      <svg id="japan-map" viewBox="-30 -40 760 880" preserveAspectRatio="xMinYMid slice"></svg>
      <div class="compass">
        <span>N</span>
        <i></i>
      </div>
      <ul class="map-key" id="map-key"></ul>
    </div>

    <aside class="countdown" aria-label="Contagem até a viagem">
      <span><b id="cd-days">—</b><small>dias</small></span>
      <span><b id="cd-hours">—</b><small>horas</small></span>
      <span><b id="cd-mins">—</b><small>min</small></span>
      <span><b id="cd-secs">—</b><small>seg</small></span>
    </aside>

    <nav class="nav-dots" id="nav-dots" aria-label="Pontos do roteiro"></nav>

    <main class="content">
      <section class="hero">
        <div class="hero-card">
          <p class="kicker">Uma viagem entre amigos</p>
          <h1>Japão<span class="jp">日本へ</span></h1>
          <p class="lede">
            31 de março de 2027 é a saída do Brasil.
          </p>
          <div class="stamp">31 mar — 22 abr · 2027</div>
          <p class="scroll-hint">Desça o roteiro</p>
        </div>
      </section>

      <div id="stops"></div>

      <section class="hero retorno">
        <div class="hero-card">
          <p class="kicker">De volta</p>
          <h1>Brasil<span class="jp">帰国</span></h1>
          <p class="lede">
            22 de abril de 2027 é o retorno ao Brasil.
          </p>
          <div class="stamp">22 abr · calendário japonês</div>
        </div>
      </section>
    </main>

    <dialog class="place-modal" id="place-modal" aria-labelledby="modal-title">
      <article>
        <header>
          <p class="kicker" id="modal-kicker"></p>
          <h3 id="modal-title"></h3>
          <button type="button" class="modal-close" id="modal-close" aria-label="Fechar">
            Fechar
          </button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </article>
    </dialog>

    <div class="grain"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
